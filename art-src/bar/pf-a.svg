<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -20 112 46" data-part="pfA" data-scale="1">
<!--
  Портафильтр, голова (блок 29-1г), вид сбоку, начало координат (0, 0) = якорь портафильтра: кофемолка (160, 440), мат (330, 470), группа (630, 350). Рамка прежняя (112 × 46).
  Круглая стальная корзина ø 58 px (12,5 см): почти прямая стенка (58 → 54), два пояска-ободка по высоте и светлая полоса света слева, чтобы читалась сталь, а не кастрюля; овал обода сверху с внутренней кромкой (кофе-эллипс cof рисует bar.ts в (0, −11,2)), по бокам «ушки» байонета, поясок у низа y 12–16, снизу по центру одинарный носик x −6…6 (низ y 24): струя x 627–633 при якоре (630, 350) идёт из него.
  Высота головы (верх обода y −17,5 … низ пояска y 16) = 33,5 px при ширине 58: отношение 0,58 (было 0,31 в 29-1, 0,54 в 29-1в).
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<rect x="-38" y="-15" width="9" height="6" rx="2.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="29" y="-15" width="9" height="6" rx="2.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<path d="M-6 16H6V22Q6 24 4 24H-4Q-6 24 -6 22Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M-29 -12C-29 -2 -28 6 -27 13H27C28 6 29 -2 29 -12Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M14 -10V12H26C27 6 28 -2 28 -10Z" fill="{{STEEL_SH}}" stroke="none"/>
<path d="M-24 -9V9" fill="none" stroke="{{HILITE}}" stroke-opacity=".85" stroke-width="{{L}}"/>
<path d="M-28 -2H28M-27.5 6H27.5" fill="none" stroke="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="-22" y="12" width="44" height="4" rx="2" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<ellipse cx="0" cy="-12" rx="29" ry="5.5" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<ellipse cx="0" cy="-11.6" rx="24.5" ry="4" fill="{{STEEL_SH}}" stroke="none"/>
</g>
</svg>
