<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -20 112 46" data-part="pfA" data-scale="1">
<!--
  Портафильтр, голова (блок 29-1б), вид сбоку, начало координат (0, 0) = якорь портафильтра: кофемолка (160, 440), мат (330, 470), группа (630, 350). Рамка прежняя (112 × 46).
  Широкая круглая стальная корзина 58 px (12,5 см): овал обода сверху с внутренней кромкой (внутри bar.ts рисует кофе-эллипс cof), ниже юбка сужается книзу, по бокам «ушки» байонета, снизу по центру одинарный носик x −6…6: струя x 627–633 при якоре (630, 350) идёт из него. Низ носика y 24.
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
