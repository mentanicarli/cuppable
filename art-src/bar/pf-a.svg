<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -20 112 46" data-part="pfA" data-scale="1">
<!--
  Портафильтр, голова (блок 29-1в), вид сбоку, начало координат (0, 0) = якорь портафильтра: кофемолка (160, 440), мат (330, 470), группа (630, 350). Рамка прежняя (112 × 46).
  Корзина-цилиндр ø 58 px (12,5 см), чуть сужается книзу (58 → 50): овал обода сверху с внутренней кромкой (кофе-эллипс cof рисует bar.ts в (0, −9,2)), по бокам «ушки» байонета, юбка до y 12, поясок y 12–16, снизу по центру одинарный носик x −6…6 (низ y 24): струя x 627–633 при якоре (630, 350) идёт из него.
  Высота головы (верх обода y −15,5 … низ пояска y 16) = 31,5 px при ширине 58: отношение 0,54 (было 0,31).
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<rect x="-38" y="-13" width="9" height="6" rx="2.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="29" y="-13" width="9" height="6" rx="2.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<path d="M-6 16H6V22Q6 24 4 24H-4Q-6 24 -6 22Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M-29 -10C-29 0 -26 8 -25 13H25C26 8 29 0 29 -10Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M16 -8C17 0 19 6 21 11L24 12C26 7 28 0 28 -8Z" fill="{{STEEL_SH}}" stroke="none"/>
<path d="M-25 -5C-25 1 -23 6 -21 10" fill="none" stroke="{{HILITE}}" stroke-opacity=".8" stroke-width="{{D}}"/>
<rect x="-22" y="12" width="44" height="4" rx="2" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<ellipse cx="0" cy="-10" rx="29" ry="5.5" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<ellipse cx="0" cy="-9.6" rx="24.5" ry="4" fill="{{STEEL_SH}}" stroke="none"/>
</g>
</svg>
