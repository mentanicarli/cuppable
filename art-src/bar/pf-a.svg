<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -20 112 46" data-part="pfA" data-scale="1">
<!--
  Портафильтр, голова (блок 29-1д), вид сбоку, начало координат (0, 0) = якорь портафильтра: кофемолка (160, 440), мат (330, 470), группа (630, 350). Рамка прежняя (112 × 46).
  Круглая стальная корзина ø 58 px (12,5 см): цилиндр со скруглённым низом, прямая стенка, без выступов; на ободе только два маленьких стальных выступа вровень с ним; справа стальной воротник у шейки; овал обода сверху с внутренней кромкой (кофе-эллипс cof рисует bar.ts в (0, −11,2)); снизу по центру одинарный носик x −6…6 (низ y 24): струя x 627–633 при якоре (630, 350) идёт из него.
  Высота головы (верх обода y −17,5 … низ корзины y 17) = 34,5 px при ширине 58: отношение 0,6.
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<rect x="-33" y="-14.5" width="4" height="5" rx="1.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="29" y="-14.5" width="4" height="5" rx="1.5" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<path d="M-6 17H6V22Q6 24 4 24H-4Q-6 24 -6 22Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M-29 -12V9Q-29 17 -21 17H21Q29 17 29 9V-12Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M15 -11V17H21Q28 17 28 9V-11Z" fill="{{STEEL_SH}}" stroke="none"/>
<path d="M-24 -8V8" fill="none" stroke="{{HILITE}}" stroke-opacity=".85" stroke-width="{{L}}"/>
<path d="M-28 0H28" fill="none" stroke="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="28" y="-2" width="8" height="14" rx="3" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<ellipse cx="0" cy="-12" rx="29" ry="5.5" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<ellipse cx="0" cy="-11.6" rx="24.5" ry="4" fill="{{STEEL_SH}}" stroke="none"/>
</g>
</svg>
