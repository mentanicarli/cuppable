<svg xmlns="http://www.w3.org/2000/svg" viewBox="306 440 48 72" data-part="tamper" data-scale="1">
<!--
  Темпер (блок 29-2): тёмная ручка-«груша», шейка, стальной цилиндр основания; стоит на мате (mat: верх мата y ≈ 510). Якорь (330, 506), ось x 330; bar.ts при tamperUp поднимает весь спрайт на 6 px (по этой причине мат — отдельная часть tamperMat и остаётся на месте).
  Размеры: высота 458…508 = 50 px (10,8 см; груша ниже верха головы портафильтра на мате (y 452), поэтому над головой не торчит), ширина основания 40 px (8,6 см), ручка 33 px; реальные 6 × 11 см → по плану ≤ 42 × 77. Когда портафильтр стоит на мате (330, 470), он закрывает ручку целиком, видны основание и шейка.
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<rect x="324" y="484" width="12" height="12" rx="3" fill="{{DARK}}" stroke-width="{{M}}"/>
<path d="M323 486C314 484.6 311 475.2 314 468C317 461.4 323 458 330 458C337 458 343 461.4 346 468C349 475.2 346 484.6 337 486Z" fill="{{DARK}}" stroke-width="{{M}}"/>
<path d="M319 475C317 470 319 465 323 462" fill="none" stroke="{{HILITE}}" stroke-opacity=".35" stroke-width="{{L}}"/>
<rect x="310" y="494" width="40" height="14" rx="5" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M338 495H345Q349 495 349 499V503Q349 507 345 507H338Z" fill="{{STEEL_SH}}" stroke="none"/>
<path d="M314 498H328" stroke="{{STEEL_HI}}" stroke-width="{{D}}" fill="none"/>
</g>
</svg>
