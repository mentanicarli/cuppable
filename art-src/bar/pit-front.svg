<svg xmlns="http://www.w3.org/2000/svg" viewBox="880 420 130 110" data-part="pitFront" data-after="pitBack" data-scale="1">
<!--
  Нержавеющий молочный питчер (блок 29-3). Якорь (940, 514), высота корпуса 78 (y −80…−2): сужается кверху, у дна «брюшко» (полуширина у дна 33, у обода 28: 1,18), донышко скруглённое. Носик слева: широкая плавная выемка в ободе, выступ за корпус 9 px, кончик закруглён (радиус 3), верх вровень с ободом. Ручка справа: плоская угловатая полоса толщиной 5,5 px (контур L): горизонталь у обода на 18 px вправо, нижняя ножка наискось и возвращается к корпусу на 72 % высоты (y −24).
  Сталь: светлый блик в левой трети (x −25…−21), тёмная полоса правее центра (x 6…12), тёмная кайма у обода. Корпус и ручка непрозрачные. Шкала уровня: выемка 5 px шириной слева от центра (x −12…−7, y −66…−14) с рисками слева от неё; цветную полоску и жидкость в овале обода (rx 24 × ry 3,8, центр (0, −79,6)) рисует код bar.ts: чем выше уровень, тем больше заполнен овал и выше полоска. Цвет жидкости в этой части не используется.
  Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<g transform="translate(940 514)">
<path d="M28 -77.75H45.75L38.72 -23.63L33.28 -24.37L39.85 -72.25H28Z" fill="{{STEEL}}" stroke-width="{{L}}"/>
<path d="M-28 -80H-34Q-37 -80 -37 -77Q-37 -73 -33 -70Q-30 -66 -29 -60L-27 -60Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M-28 -80C-29 -50 -35 -30 -33 -12Q-33 -2 -22 -2H22Q33 -2 33 -12C35 -30 29 -50 28 -80Z" fill="{{STEEL}}" stroke-width="{{M}}"/>
<path d="M-25 -70H-21V-18Q-23 -14 -25 -16Z" fill="{{HILITE}}" fill-opacity=".6" stroke="none"/>
<path d="M6 -72H12V-16Q9 -12 6 -14Z" fill="{{STEEL_SH}}" fill-opacity=".8" stroke="none"/>
<rect x="-12" y="-66" width="5" height="52" rx="2.5" fill="{{DARK}}" stroke-width="{{D}}"/>
<path d="M-17 -66H-13M-17 -53H-13M-17 -40H-13M-17 -27H-13M-17 -14H-13" fill="none" stroke-width="{{D}}"/>
<ellipse cx="0" cy="-80" rx="28" ry="5" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<ellipse cx="0" cy="-79.6" rx="24" ry="3.8" fill="{{STEEL_SH}}" stroke="none"/>
<path d="M-26 -80Q0 -75 26 -80" fill="none" stroke="{{STEEL_SH}}" stroke-width="{{D}}"/>
</g>
</g>
</svg>
