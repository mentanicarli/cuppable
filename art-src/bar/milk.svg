<svg xmlns="http://www.w3.org/2000/svg" viewBox="1058 236 206 278" data-part="milk" data-scale="1">
<!--
  Холодильник с молоком (блок 29-2): маленький холодильник: корпус 190 × 262 (41 × 56 см по шкале 4,64; реальный настольный 45 × 60), дверца с рамкой, внутри верхняя полка с двумя пакетами молока (гребень, этикетка, листок), нижний ящик, вертикальная ручка, ножки. Подпись «молоко» рисует Pixi-текстом на пакете: размер 12 без сжатия (x 1124, y 354), табличка 56 px (поля слева и справа ≥ 4 px). Зона milk (1066–1256 × 244–506) и ZONE_POS.milk не менялись.
  В блок входит край полки сиропов (рисуется поверх корпуса, как раньше): те же фигуры и заливка, что в части syrupShelf (блок 29-3), поэтому шва нет.
-->
