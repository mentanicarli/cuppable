<svg xmlns="http://www.w3.org/2000/svg" viewBox="1058 236 206 278" data-part="milk" data-scale="1">
<!--
  Холодильник с молоком (блок 29-2): маленький холодильник: корпус 190 × 262 (41 × 56 см по шкале 4,64; реальный настольный 45 × 60), дверца с рамкой, внутри верхняя полка с двумя пакетами молока (гребень, этикетка, листок), нижний ящик, вертикальная ручка, ножки. Подпись «молоко» рисует Pixi-текстом на пакете, как раньше (x 1123, y 353). Зона milk (1066–1256 × 244–506) и ZONE_POS.milk не менялись.
  Внизу справа от холодильника в блок входит край полки сиропов (рисуется поверх корпуса, как раньше): тот же разметкой и заливкой, что полка в static (старая полка 29-3 заменит её без шва).
-->
