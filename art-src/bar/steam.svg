<svg xmlns="http://www.w3.org/2000/svg" viewBox="820 390 60 70" data-part="steam" data-scale="1">
<!--
  Пар у кончика паровой трубки (блок 29-2): три светлых завитка PAPER (прозрачность .8–.95) с тонким контуром D цвета KRAFT_DP; стоят у трубки (кончик x 827–837, y 450), основание (843, 442); с 31-9 все завитки правее x 846,5 не заходят (до кофеварки x 859 зазор ≥ 12): пар не касается ни зоны пара (до 847), ни кофеварки. Раньше внутри был скрытый слой с opacity 0, пар не был виден. bar.ts плавно ведёт alpha спрайта к 0,9 при f.steam и к 0 иначе; рамка 820–880 × 390–460 прежняя.
-->
<g stroke="{{KRAFT_DP}}" stroke-linejoin="round" stroke-linecap="round" stroke-width="{{D}}">
<path d="M837 442Q831 430 838 418Q845 406 838 394L842 394Q848 406 843 420Q837 430 843 442Z" fill="{{PAPER}}" fill-opacity=".95"/>
<path d="M830 448Q825 438 832 428Q838 418 832 408L836 408Q843 418 836 430Q832 438 836 448Z" fill="{{PAPER}}" fill-opacity=".85"/>
<path d="M830 428Q825 421 831 414Q836 407 831 400L835 400Q841 407 836 416Q831 421 836 428Z" fill="{{PAPER}}" fill-opacity=".8"/>
