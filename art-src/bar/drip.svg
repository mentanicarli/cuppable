<svg xmlns="http://www.w3.org/2000/svg" viewBox="272 252 120 176" data-part="drip" data-after="corkBoard" data-scale="1">
<!--
  Капельная кофеварка на стенной полке над матом темпера (блок 31-8Б, раскладка Ц1 из docs/design/filter-coffee.md).
  Предмет 112 × 158 px в x 276–388, y 252–410 (бытовая кофеварка 24 × 34 см при 4,64 px/см), полка 120 × 18 в x 272–392, y 410–428 (доска и два кронштейна).
  Тёмный корпус: голова с кнопкой, колонна с окошком воды, подогрев; стеклянная колба с ручкой слева стоит на подогреве. Уровень кофе в колбе рисует код (прямоугольник
  x 298–336, дно y 392, полная высота 52 px до y 340) между этой частью и передней (dripFront: блики). Подписей нет, контур L/M/D, цвета из палитры.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<g data-item="drip" data-box="276 252 112 158">
<rect x="342" y="262" width="44" height="134" rx="8" fill="{{DARK}}" stroke-width="{{M}}"/>
<rect x="354" y="282" width="20" height="56" rx="6" fill="{{GLASS}}" stroke-width="{{D}}"/>
<rect x="356" y="312" width="16" height="24" rx="4" fill="{{DUSTY}}" stroke="none"/>
<path d="M349 274V386" fill="none" stroke="{{STEEL_SH}}" stroke-opacity=".6" stroke-width="{{L}}"/>
<rect x="292" y="252" width="96" height="38" rx="10" fill="{{DARK}}" stroke-width="{{M}}"/>
<path d="M300 259H358" fill="none" stroke="{{STEEL_HI}}" stroke-opacity=".45" stroke-width="{{L}}"/>
<circle cx="372" cy="272" r="5" fill="{{MUSTARD}}" stroke-width="{{D}}"/>
<rect x="308" y="290" width="40" height="6" rx="2" fill="{{STEEL}}" stroke-width="{{D}}"/>
<path d="M306 296H350L344 316H312Z" fill="{{STEEL_HI}}" stroke-width="{{M}}"/>
<path d="M314 304H342" fill="none" stroke="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="324" y="316" width="6" height="6" rx="2" fill="{{STEEL}}" stroke-width="{{D}}"/>
<path d="M327 322V326" fill="none" stroke="{{CHOC}}" stroke-width="{{M}}"/>
<rect x="278" y="396" width="110" height="14" rx="5" fill="{{DARK}}" stroke-width="{{M}}"/>
<path d="M286 400H380" fill="none" stroke="{{STEEL_SH}}" stroke-opacity=".7" stroke-width="{{D}}"/>
<path d="M292 330H342L338 392Q338 396 333 396H301Q296 396 296 392Z" fill="{{GLASS}}" stroke-width="{{M}}"/>
<path d="M292 342Q276 344 278 364Q280 382 296 384" fill="none" stroke-width="{{M}}"/>
<rect x="296" y="322" width="46" height="8" rx="3" fill="{{DARK}}" stroke-width="{{M}}"/>
</g>
<g data-shelf="1">
<path d="M284 420V428L296 420Z" fill="{{WOOD_SH}}" stroke-width="{{D}}"/>
<path d="M380 420V428L368 420Z" fill="{{WOOD_SH}}" stroke-width="{{D}}"/>
<rect x="272" y="410" width="120" height="10" rx="3" fill="{{WOOD}}" stroke-width="{{M}}"/>
<path d="M278 414H386" fill="none" stroke="{{WOOD_HI}}" stroke-width="{{D}}"/>
</g>
</g>
</svg>
