<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 120 200 370" data-part="grinderFront" data-scale="1">
<!--
  Кофемолка, передний слой (блок 29-1). Все размеры как раньше: воронка (трапеция из bar.ts: x 88–232 вверху, 108–212 внизу), крышка y 140–160, корпус x 96–224, y 262–456, основание y 448–470, ручка помола (dial) в (160, 332) r 17, зона grind x 90–230, y 170–470.
  Портафильтр у кофемолки стоит в точке (160, 440): позади него тёмная ниша y 396–456 с люлькой (пластина y 440–448), над ним носик-выдача до y 424, так что при помоле кофе падает в корзину, а не в воздух. Нишу видно и без портафильтра.
  Свет сверху слева. Контур 3,5 / 3 / 2 px. Подписей нет.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<g transform="translate(160 470)">
<path d="M-52 -208L-72 -312H72L52 -208Z" fill="none" stroke-width="{{M}}"/>
<path d="M-58 -270L-52 -224" stroke="{{HILITE}}" stroke-opacity=".7" stroke-width="{{L}}" fill="none"/>
<rect x="-80" y="-330" width="160" height="20" rx="10" fill="{{HILITE}}" stroke-width="{{L}}"/>
<path d="M-70 -322H60" stroke="{{KRAFT_SH}}" stroke-width="{{D}}" fill="none"/>
<rect x="-14" y="-340" width="28" height="12" rx="6" fill="{{MUSTARD}}" stroke-width="{{D}}"/>
<path d="M-64 -14V-196Q-64 -208 -52 -208H52Q64 -208 64 -196V-14Z" fill="{{TERRA}}" stroke-width="{{L}}"/>
<path d="M44 -204H52Q60 -204 60 -196V-18H44Z" fill="{{SHADOW}}" fill-opacity=".16" stroke="none"/>
<path d="M-56 -194Q-56 -200 -50 -200" stroke="{{HILITE}}" stroke-opacity=".5" stroke-width="{{M}}" fill="none"/>
<rect x="-44" y="-184" width="88" height="62" rx="12" fill="{{HILITE}}" stroke-width="{{M}}"/>
<g stroke-width="{{D}}" fill="none">
<path d="M-26 -143L-31 -147M-14 -161L-17 -167M0 -165V-172M14 -161L17 -167M26 -143L31 -147"/>
</g>
<rect x="-40" y="-74" width="80" height="60" rx="8" fill="{{DARK}}" stroke-width="{{M}}"/>
<rect x="-14" y="-110" width="28" height="36" rx="6" fill="{{STEEL}}" stroke-width="{{M}}"/>
<rect x="-8" y="-76" width="16" height="16" rx="3" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="-34" y="-30" width="68" height="8" rx="4" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
<rect x="-56" y="-22" width="112" height="22" rx="8" fill="{{DARK}}" stroke-width="{{L}}"/>
<path d="M-44 -11H44" stroke="{{CHOC}}" stroke-width="{{L}}" fill="none"/>
</g>
</g>
</svg>
