<!--
  Кофемашина на две группы (блок 29-1, пилот центра). Стоит на столешнице, низ поддона y 508. Высота 138…508 = 370 px (было 170…508 = 338, ×1,09; предел сверху — нижний край билета y 130 и зазор 6 px).
  Корпус x 456–804 (348 px = 75 см по шкале 4,64, как раньше). Всё, на чём стоят подвижные детали и зоны, осталось на своих местах:
    панель: ручка пара (520, 257) r 21, манометр (630, 257) r 27 (стрелка needle вращается вокруг этой точки), кнопка «стоп» (740, 257) r 21 (зона stop x 716–764, y 231–279);
    ниша: x 474–786, y 300–490, группа x 584–676, y 300–352, прокладка и носики до y 367 (портафильтр (630, 350)), чашка (630, 478), поддон y 486–508;
    кран горячей воды: носик в x 489–526, y 300–345 (зона water x 466–536, y 296–376); паровая трубка: x 791–837, конец (832, 450) (зона steam x 776–876, y 296–466; пар steam стартует из (838, 440)).
  Сверху подогрев чашек: поднос y 184–206 и три чашки ВВЕРХ ДНОМ явным контуром (обод на подносе самый широкий, сужение к донышку до 72 %, донышко светлая плоскость того же цвета, что тело, с тонким кольцом ножки, ручка от донышка к ободу); высоты 45 / 39 / 33 px, ширины 55 / 47 / 40 px. Блок чашек между метками cups ниже генерирует scripts/make-warmer-cups.mjs (одна функция на все три), руками не править; в самом комментарии метки писать нельзя: сборка режет комментарии по первому закрытию.
-->
